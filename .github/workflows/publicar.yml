# Publica o app no GitHub Pages a cada envio para o main.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Se algum teste de lógica falhar, o app não é publicado.
      - run: npx playwright test --project=logica
        env:
          SO_LOGICA: 1
      - run: npx ng build --base-href /${{ github.event.repository.name }}/
      # O GitHub Pages não conhece as rotas do Angular: o 404.html abre o app em qualquer endereço.
      - run: cp dist/biblia-sagrada/browser/index.html dist/biblia-sagrada/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/biblia-sagrada/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
